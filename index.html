<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="text">
                <h3 id="name">  Victor Crest </h3>
                <h3 id="number">23</h3>
                <h3 id="country">London</h3>
            </div>
            <hr>
            <div class="stats">
                <div class="stat">
                    <h2>80K</h2>
                    <p>Followers</p>
                </div>

                <div class="stat">
                    <h2>803K</h2>
                    <p>Likes</p>
                </div>

                <div class="stat">
                    <h2>1.4K</h2>
                    <p>Photos</p>
                </div>
            </div>
        </div>
        <div class="image"></div>
    </div>
</body>
</html>
